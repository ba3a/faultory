name: Issue Teammate

# Add the label below to an issue and the AI Teammate implements it and opens a pull request.
# Only users with triage access can add a label, which is the authorization gate.
# The pipeline itself lives in ba3a/ci-pipelines; this file is generated by its scripts/sync.sh.

run-name: "Issue #${{ github.event.issue.number || inputs.issue_number }}"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

permissions:
  contents: read

jobs:
  teammate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'dmtools:develop'
    uses: ba3a/ci-pipelines/.github/workflows/ai-teammate.yml@v1
    with:
      issue_number: ${{ github.event.issue.number || inputs.issue_number }}
      java_version: '21'
      claude_max_turns: '60'
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      CLAUDE_CODE_API_KEY: ${{ secrets.CLAUDE_CODE_API_KEY }}
