name: Issue Teammate

# Add the label below to an issue and the AI Teammate implements it and opens a pull request.
# Only users with triage access can add a label, which is the authorization gate.
# The state machine (machine-sm.yml) starts the review and rework legs by dispatching this
# workflow with a leg and an issue or a pull request.
# The pipeline itself lives in ba3a/ci-pipelines; this file is generated by its scripts/sync.sh.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('{0} · {1}', inputs.leg || 'dev', inputs.pr != '' && format('pr-{0}', inputs.pr) || format('gh-{0}', inputs.issue))
      || format('dev · gh-{0}', github.event.issue.number) }}

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to process. Empty when a pull request is given.'
        required: false
        default: ''
      pr:
        description: 'Pull request number, for a review or rework of a pull request without an issue'
        required: false
        default: ''
      leg:
        description: 'Which leg to run'
        required: true
        type: choice
        default: dev
        options: [dev, review, rework]
      reason:
        description: 'Why this run was started (audit trail)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  teammate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'dmtools:develop'
    uses: ba3a/ci-pipelines/.github/workflows/ai-teammate.yml@v1
    with:
      issue_number: ${{ github.event.issue.number || inputs.issue }}
      pr_number: ${{ inputs.pr }}
      leg: ${{ inputs.leg || 'dev' }}
      java_version: '21'
      claude_max_turns: '150'
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      CLAUDE_CODE_API_KEY: ${{ secrets.CLAUDE_CODE_API_KEY }}
