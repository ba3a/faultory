name: Machine SM

# The state machine of the machine loop: it watches the issues and pull requests the AI Teammate
# works on and starts the review and rework legs. It never merges; you do.
# A tick runs no AI model. It runs after CI and after every Issue Teammate run, and on a timer as
# the safety net for a missed event. Dispatch it by hand with "dry run" to see the plan only.
# The pipeline itself lives in ba3a/ci-pipelines; this file is generated by its scripts/sync.sh.

run-name: >-
  SM ${{ github.event_name == 'workflow_dispatch' && 'manual tick' || github.event_name }}${{
  github.event_name == 'workflow_dispatch' && inputs.dryRun && ' (dry run)' || '' }}

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: [CI, Issue Teammate]
    types: [completed]
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Log the plan and act on nothing'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  sm:
    uses: ba3a/ci-pipelines/.github/workflows/sm.yml@v1
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun && 'true' || 'false' }}
      machine_author: 'ba3a'
      workflow_file: 'issue-teammate.yml'
      ci_workflow: 'ci.yml'
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
